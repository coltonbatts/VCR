name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: VCR Branding
        run: |
          echo "██╗   ██╗ ██████╗██████╗ "
          echo "██║   ██║██╔════╝██╔══██╗"
          echo "██║   ██║██║     ██████╔╝"
          echo "╚██╗ ██╔╝██║     ██╔══██╗"
          echo " ╚████╔╝ ╚██████╗██║  ██║"
          echo "  ╚═══╝   ╚═════╝╚═╝  ╚═╝"
          echo "VCR SYSTEM QUALITY CHECK INITIALIZED"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: VCR Branding
        run: |
          echo "██╗   ██╗ ██████╗██████╗ "
          echo "██║   ██║██╔════╝██╔══██╗"
          echo "██║   ██║██║     ██████╔╝"
          echo "╚██╗ ██╔╝██║     ██╔══██╗"
          echo " ╚████╔╝ ╚██████╗██║  ██║"
          echo "  ╚═══╝   ╚═════╝╚═╝  ╚═╝"
          echo "VCR REGRESSION TESTING INITIALIZED"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        # Note: determinism tests force software rendering, which works in CI
        run: cargo test --all-targets

      - name: MCP adapter tests
        # Uses the checkout's target/debug/vcr built by the step above (engine selection prefers it).
        run: |
          python3 -m pip install --quiet "mcp[cli]>=1.0.0,<2" httpx pyyaml
          cargo build --bin vcr
          python3 -m unittest discover -s scripts/vcr-mcp-server/tests -v

  determinism:
    name: Determinism Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: VCR Branding
        run: |
          echo "██╗   ██╗ ██████╗██████╗ "
          echo "██║   ██║██╔════╝██╔══██╗"
          echo "██║   ██║██║     ██████╔╝"
          echo "╚██╗ ██╔╝██║     ██╔══██╗"
          echo " ╚████╔╝ ╚██████╗██║  ██║"
          echo "  ╚═══╝   ╚═════╝╚═╝  ╚═╝"
          echo "VCR DETERMINISM VERIFICATION INITIALIZED"

      - name: Install FFmpeg
        # The determinism tests encode real .mov files; without ffmpeg they fail to enqueue frames.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Determinism Tests
        run: cargo test --test determinism

      - name: Determinism Report (golden scene)
        run: |
          cargo build --release --bin vcr
          ./target/release/vcr determinism-report examples/white_on_alpha.vcr --frame 0 --json

  tape-deck:
    name: Tape Deck Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: vhs-tape-deck/go.mod
          cache: true
          cache-dependency-path: vhs-tape-deck/go.sum

      - name: Run Tape Deck Tests
        working-directory: vhs-tape-deck
        run: go test ./...
